[project]
name = "crmanic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.0",
    "pyrefly>=1.2.0",
]

[tool.pyrefly]
preset = "default"
project-excludes = ['**/.venv', '**/tests', '**/migrations']

[tool.pyrefly.errors]
bad-override = false
bad-assignment = false
